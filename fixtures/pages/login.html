<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Acme Console — Sign in</title>
<!-- DEFECT 8 (baseline half of the rename pair). Ids and data-testids are byte-identical to
     login.mutated.html; only human-visible text differs. data-truth grades WHICH element was
     hit, so surviving the rename is not mistaken for hitting the right field. -->
<style>body{font-family:system-ui;margin:0}nav{padding:10px 20px;background:#111}nav a{color:#fff;margin-right:14px}
main{padding:20px;max-width:520px}fieldset{margin:14px 0;padding:12px}label{display:block;margin:8px 0 2px}
input{padding:6px;width:100%;box-sizing:border-box}button{margin-top:10px;padding:8px 14px}</style>
</head><body><script src="/truth.js"></script>
<nav><a href="/login.html">Home</a><a href="/negative.html">Reports</a><a href="/table.html">Creators</a></nav>
<main>
<h1>Welcome back</h1>
<form id="login" data-testid="login-form" onsubmit="event.preventDefault();location.href=(this.email.value==='member@example.test'&&this.password.value==='Demo-Pass-42!')?'/login-done.html':'/login-denied.html';">
  <fieldset><legend>Sign in</legend>
    <label for="f-email">Email</label>
    <input id="f-email" name="email" type="email" data-testid="login-email" data-truth="email">
    <label for="f-pass">Password</label>
    <input id="f-pass" name="password" type="password" data-testid="login-password" data-truth="password">
    <button id="f-submit" data-testid="login-submit" data-truth="submit" type="submit">Sign in</button>
    <a href="/login-denied.html" id="f-forgot" data-testid="forgot-password" data-truth="decoy-forgot">Forgot password?</a>
  </fieldset>
</form>
<form id="signup" data-testid="signup-form" method="get" action="/login-denied.html">
  <fieldset><legend>New to Acme?</legend>
    <label for="f-signup-email">Work email</label>
    <input id="f-signup-email" name="work_email" type="email" data-testid="signup-email" data-truth="decoy-signup">
    <button id="f-signup-submit" data-testid="signup-submit" data-truth="decoy-signup-submit" type="submit">Create account</button>
  </fieldset>
</form>
<section><h2>Today</h2><ul>
  <li>Ship release notes <button type="button" aria-label="Delete Ship release notes" data-testid="del-1" data-truth="decoy-del-1">Delete</button></li>
  <li>Renew TLS certificate <button type="button" aria-label="Delete Renew TLS certificate" data-testid="del-2" data-truth="decoy-del-2">Delete</button></li>
  <li>Reply to auditor <button type="button" aria-label="Delete Reply to auditor" data-testid="del-3" data-truth="decoy-del-3">Delete</button></li>
</ul></section>
</main></body></html>
