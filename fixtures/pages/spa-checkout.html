<!doctype html>
<!-- v0.3 fixture: a single-page checkout (saucedemo shape). The overview is inserted as ONE large
     block (more than 300 characters of text) whose subtotal line is two text nodes (React style);
     Finish swaps the view with history.pushState, no page load. expectSeen must remember the subtotal.
     NB: never write the asserted text in this comment: the recorder would capture it at page load. -->
<html><head><meta charset="utf-8"><title>Checkout</title></head>
<body>
<main id="app">
  <h1>Your cart</h1>
  <p>Sauce Labs Backpack, Sauce Labs Bike Light</p>
  <button id="go">Continue to overview</button>
</main>
<script>
const app = document.getElementById("app");
document.getElementById("go").onclick = () => {
  const view = document.createElement("section");
  view.innerHTML = `<h1>Checkout: overview</h1>
    <p>Payment information: SauceCard #31337. Shipping information: Free Pony Express Delivery!
    Your order ships within two business days. Returns are accepted within thirty days of delivery
    when the items are unused and in their original packaging. Taxes are calculated on the item
    total and shown below. Review the items and the totals, then finish the order.</p>
    <div id="sub"></div><p>Tax: $3.20</p><p>Total: $43.18</p>
    <button id="finish">Finish</button>`;
  // React renders "Item total: $" and "39.98" as two text nodes in one element.
  const sub = view.querySelector("#sub");
  sub.append(document.createTextNode("Item total: $"), document.createTextNode("39.98"));
  app.replaceChildren(view);
  document.getElementById("finish").onclick = () => {
    history.pushState({}, "", "/spa-checkout/complete");
    app.replaceChildren(Object.assign(document.createElement("h1"), { textContent: "Thank you for your order!" }));
  };
};
</script>
</body></html>
