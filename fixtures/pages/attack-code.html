<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Checkout</title>
<!-- ATTACK CASE: an expired code must be refused AND leave the total unchanged. ?bug=1 is the app bug:
     it shows the refusal but applies the discount anyway, so expect:["This code has expired."] alone
     is a FALSE PASS. expectAbsent:["SUMMER25 25%"] catches it (outcome ABSENT_SEEN). -->
<style>body{font-family:system-ui;padding:16px;max-width:620px}label{display:block;margin:10px 0 2px}input{padding:6px}button{margin:6px 6px 0 0;padding:6px 12px}</style></head><body><script src="/truth.js"></script>
<h1>Checkout</h1><p>2 tickets × €50.00</p>
<form id="f" onsubmit="return false"><label for="code">Discount code</label><input id="code" name="code" data-truth="code">
<button type="submit" data-truth="apply">Apply</button></form>
<p id="msg" role="alert"></p><p id="line"></p><p>Total <span id="total">€100.00</span></p>
<script>
var bug = new URLSearchParams(location.search).get("bug") === "1";
document.getElementById("f").addEventListener("submit", function () {
  var c = document.getElementById("code").value.trim().toUpperCase();
  if (c !== "SUMMER25") { document.getElementById("msg").textContent = "Unknown discount code."; return; }
  document.getElementById("msg").textContent = "This code has expired.";
  if (bug) { document.getElementById("line").textContent = "SUMMER25 25% −€25.00"; document.getElementById("total").textContent = "€75.00"; }
});
</script></body></html>
