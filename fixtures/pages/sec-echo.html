<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sign in</title>
<!-- AUDIT SECURITY S2: the app echoes the typed value into a BUTTON's text ("Send link to x").
     The field content is withheld, but the button label is not. -->

<h1>Magic link</h1>
<form method="get" action="/done.html">
  <label for="f-code">Recovery code</label><input id="f-code" name="Code" data-truth="code">
  <button type="submit" id="go" data-truth="save">Verify code</button>
</form>

</body></html>
